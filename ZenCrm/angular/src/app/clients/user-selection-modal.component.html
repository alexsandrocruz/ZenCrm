<div class="modal-header">
  <h4 class="modal-title">{{ title }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <div class="mb-3">
    <label for="userSearch" class="form-label">{{ '::Client:SearchUsers' | abpLocalization }}</label>
    <div class="input-group">
      <input
        type="text"
        id="userSearch"
        class="form-control"
        placeholder="{{ '::Client:TypeToSearch' | abpLocalization }}"
        [formControl]="searchForm.get('searchTerm')"
        (input)="onSearchChange($event)"
        (change)="onUserSelect($event)"
        list="user-datalist"
        autocomplete="off"
      />
      <datalist id="user-datalist">
        <option
          *ngFor="let user of (filteredUsers$ | async); trackBy: trackUserById"
          [value]="getUserDisplayName(user)"
        >
          {{ user.email || user.userName }}
        </option>
      </datalist>
      <button class="btn btn-outline-secondary" type="button" (click)="clearSelection()" title="Clear search">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <small class="form-text text-muted">{{ '::Client:SearchByNameEmail' | abpLocalization }}</small>
  </div>

  <!-- Error state -->
  <div *ngIf="errorMessage" class="alert alert-danger py-2">
    {{ errorMessage }}
  </div>

  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="text-center py-2">
    <div class="spinner-border spinner-border-sm" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span class="ms-2">{{ '::Client:SearchingUsers' | abpLocalization }}</span>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">
    Cancel
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="confirmSelection()"
    [disabled]="!selectedUser"
  >
    <i class="fas fa-check me-1"></i>
    {{ '::Client:SelectUser' | abpLocalization }}
  </button>
</div>
